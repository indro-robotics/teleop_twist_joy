teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.7
    scale_linear_turbo:
      x: 1.5

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.4

    use_fort: true
    require_enable_button: true
    enable_button: 4 # 4 is the estop button on the fort controller
    enable_turbo_button: -1  # L1 shoulder button
